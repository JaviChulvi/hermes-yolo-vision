name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python --torch-backend cpu -e '.[dev]'
      - run: .venv/bin/ruff check hermes_yolo_vision scripts tests evals
      - run: .venv/bin/pytest -q
      - run: .venv/bin/python -m build
