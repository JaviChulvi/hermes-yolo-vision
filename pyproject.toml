[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-yolo-vision"
version = "0.1.0"
description = "Give your Hermes agent eyes with Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "ultralytics==8.4.212",
  "av==19.0.2",
  "lap==0.5.12",
  "clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14", "jsonschema>=4", "build>=1"]

[project.scripts]
hermes-yolo-vision = "hermes_yolo_vision.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_yolo_vision*"]

[tool.setuptools.package-data]
hermes_yolo_vision = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["inference: real model inference (explicit opt-in)", "hermes: requires HERMES_AGENT_REPO"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
